[project]
name = "notion-migration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/common-libs",
    "apps/migration-engine",
    "apps/tracing",
]

[tool.ruff.lint]
# Enable Pylint (PL), Docstrings (D), and Import Sorting (I)
select = [
    "E", "F",     # Default Flake8 rules
    "PL",         # Pylint-inspired rules (covers R0903, C0103, etc.)
    "D",          # pydocstyle (covers C0114, C0115, C0116)
    "I",          # isort (covers C0411 import order)
]

ignore = [
    "D102",  # Ignore missing docstring in public methods
    "D103",  # Ignore missing docstring in public functions
    "D101",  # Ignore missing docstring in public class
    "D100",  # Ignore missing docstring in public module
    "D104",  # Ignore missing docstring in public package
    "D107",  # Ignore missing docstring in `__init__` method
    "D105",  # Missing docstring in magic method
    "E501",  # Line too long (handled by Pylint)
]

exclude = [
    "build",
    "dist",
    ".venv",
    "__pypackages__",
    ".dev",
    ".dev/**",
    "**/tests/**",
]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

ignore = [
    "build",
    "dist",
    ".venv",
    "__pypackages__",
    ".dev",
    ".dev/**",
    "**/tests/**"
]

[dependency-groups]
dev = []
