[project]
name = "notion-migration"
version = "0.1.0"
description = ""
authors = [
    {name = "Reza Saidafkan",email = "93768131+rsaidafk@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "dotenv (>=0.9.9,<0.10.0)",
    "notion-client (>=2.5.0,<3.0.0)",
    "dataclasses-json (>=0.6.7,<0.7.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "pylint (>=4.0.2,<5.0.0)",
    "types-python-dateutil (>=2.9.0.20251008,<3.0.0.0)",
    "ruff (>=0.14.2,<0.15.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "aiolimiter (>=1.2.1,<2.0.0)",
    "py-spy (>=0.4.1,<0.5.0)"
]

[tool.poetry]
packages = [{include = "notion_migration", from = "src"}]

[tool.ruff.lint]
# Enable Pylint (PL), Docstrings (D), and Import Sorting (I)
select = [
    "E", "F",     # Default Flake8 rules
    "PL",         # Pylint-inspired rules (covers R0903, C0103, etc.)
    "D",          # pydocstyle (covers C0114, C0115, C0116)
    "I",          # isort (covers C0411 import order)
]

[tool.ruff.lint.pydocstyle]
convention = "google" # Or "numpy" / "pep257"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
